name: Lendo arquivos compartilhado entre steps
on:
  push:
    branches:
      - main

jobs:
  entresteps:
    runs-on: ubuntu-latest
    steps: 
      - name: Confere versao do ubuntu
        run: cat /etc/os-release
      
      - name: Exibir Mensagem
        run: echo "Parapapa aqui" > message.txt
      
      - name: Nao sei que la que tem
        run: ls -lha

      - name: Le arquivo
        run: cat message.txt
