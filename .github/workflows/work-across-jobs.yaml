name: Lendo arquivos compartilhado entre steps
on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    steps: 
      - name: Confere versao do ubuntu
        run: cat /etc/os-release
      
      - name: Exibir Mensagem
        run: echo "Parapapa aqui" > ${{github.workspace}}/message.txt
      
      - uses: actions/upload-artifact@v4
        with:
          name: pasta
          path: ${{github.workspace}}/message.txt

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Ver conteudo do diretorio
        run: ls -lha
      
      - uses: actions/upload-artifact@v4
        with:
          name: pasta
          path: message.txt
      
      - name: Ver conteudo do diretorio
        run: ls -lha && ls ./pasta/

      - name: Acessa arquivo mensagem
        run: mv pasta/message.txt . && rm -rf ./pasta
      
      - name: Ver conteudo do diretorio
        run: ls -lha

      - name: Acessa arquivo mensagem
        run: cat message.txt
